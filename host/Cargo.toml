[package]
name = "host"
version = "0.1.3"
edition = "2021"

[dependencies]
methods = { path = "../methods" }
risc0-zkvm = { version = "^3.0.6" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = "1.0.229"
jwt-core = { path = "../core" }
jwt-compact = { version = "0.8", features = ["rsa"] }
borsh = "1.8.1"
serde_json = "1.0.151"
base64 = "0.23.1"
sha2 = "0.11.0"
clap = { version = "4.6.6", features = ["derive"] }
uuid = { version = "1.26.1", features = ["v4"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
color-eyre = "0.6.5"
insta = "1.48.0"

[features]
cuda = ["risc0-zkvm/cuda"]
default = []
prove = ["risc0-zkvm/prove"]

[[bin]]
name = "sign_pod"
path = "./src/bin/sign_pod.rs"

[[bin]]
name = "prove"
path = "./src/bin/prove.rs"

[[bin]]
name = "verify"
path = "./src/bin/verify.rs"

[[bin]]
name = "get_fingerprint"
path = "./src/bin/get_fingerprint.rs"

[[bin]]
name = "gen_delivery_claims_file"
path = "./src/bin/gen_delivery_claims_file.rs"

[[bin]]
name = "tui"
path = "./src/bin/tui.rs"
